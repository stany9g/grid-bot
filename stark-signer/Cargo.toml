[package]
name = "stark-signer"
version = "0.1.0"
edition = "2021"
description = "Native Stark signature library for GridBot.Extended"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
starknet-crypto = "0.8"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
